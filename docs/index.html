<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to Bank Churners</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #667085;
        --line: #d9e2ec;
        --soft: #f8fafc;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--soft);
      }

      main {
        width: min(620px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        color: var(--accent);
        font-weight: 700;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Opening Bank Churners...</h1>
      <p id="message">You are being redirected to the Streamlit app.</p>
      <p id="fallback"></p>
    </main>

    <script src="./config.js"></script>
    <script>
      const config = window.BANK_CHURNERS_DEPLOYMENT || {};
      const appUrl = config.streamlitAppUrl || "";
      const isConfigured = appUrl && !appUrl.includes("YOUR-STREAMLIT-SUBDOMAIN");

      if (isConfigured) {
        document.getElementById("fallback").innerHTML =
          `If the redirect does not start, <a href="${appUrl}">open Bank Churners manually</a>.`;
        window.location.replace(appUrl);
      } else {
        document.getElementById("title").textContent = "Bank Churners redirect is not configured yet";
        document.getElementById("message").innerHTML =
          "Update <code>docs/config.js</code> with the deployed Streamlit URL.";
        document.getElementById("fallback").innerHTML =
          '<a href="https://streamlit.io/cloud">Open Streamlit Community Cloud</a>';
      }
    </script>
  </body>
</html>
